  <title>ピルリマインダー</title>
  <style>
    :root {
      --primary: #ff7eb3;
      --primary-light: #ffb3c6;
      --success: #a8e6cf;
      --danger: #ff758c;
      --warning: #ffb8b8;
      --bg-color: #fff5f7;
      --card-bg: #ffffff;
      --text-main: #5d4037;
      --text-sub: #bcaaa4;
    }

    body {
      font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    .header { width: 100%; max-width: 350px; text-align: center; margin-bottom: 20px; margin-top: 10px; }
    .header h1 { margin: 0; font-size: 1.1rem; color: var(--text-sub); font-weight: bold; }
    #date-display { font-size: 1.8rem; font-weight: bold; margin-top: 5px; color: var(--primary); }

    .cycle-card {
      width: 100%; max-width: 350px; background: var(--card-bg); border-radius: 24px;
      padding: 20px; box-shadow: 0 8px 24px rgba(255, 126, 179, 0.15); margin-bottom: 15px;
      box-sizing: border-box; text-align: center; position: relative;
    }
    .cycle-title { font-size: 1rem; color: var(--text-sub); margin-bottom: 5px; font-weight: bold; }
    .cycle-days { font-size: 2.4rem; font-weight: bold; color: var(--primary); }
    .cycle-days span { font-size: 1.2rem; color: var(--text-main); font-weight: bold; }
    
    #edit-days-btn {
      position: absolute; top: 15px; right: 15px; background: none; border: none;
      color: var(--primary-light); font-size: 1.4rem; cursor: pointer; padding: 5px;
    }
    
    .progress-container { width: 100%; height: 10px; background: #ffe3e9; border-radius: 5px; margin-top: 15px; overflow: hidden; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, #ffb3c6, #ff7eb3); border-radius: 5px; transition: width 0.3s ease, background 0.3s ease; }
    .progress-labels { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-sub); margin-top: 5px; font-weight: bold; }

    #alert-banner {
      display: none; width: 100%; max-width: 350px; background: #ffe3e9; color: var(--danger);
      padding: 15px; border-radius: 16px; font-size: 0.95rem; font-weight: bold; margin-bottom: 20px;
      box-sizing: border-box; line-height: 1.5; border-left: 6px solid var(--danger);
    }

    .main-action-area { margin: 25px 0 35px; display: flex; flex-direction: column; align-items: center; }
    #action-btn {
      width: 190px; height: 190px; border-radius: 50%; font-size: 2.2rem; font-weight: bold; color: white;
      border: none; box-shadow: 0 12px 24px rgba(255, 126, 179, 0.35); cursor: pointer;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #action-btn:active { transform: scale(0.92); }
    .not-taken { background: linear-gradient(135deg, #ffb3c6 0%, #ff7eb3 100%); }
    .taken { background: linear-gradient(135deg, #a8e6cf 0%, #76d7b6 100%); box-shadow: 0 12px 24px rgba(168, 230, 207, 0.4); }

    .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 350px; margin-bottom: 25px; }
    .control-btn {
      background: var(--card-bg); border: none; padding: 18px 10px; border-radius: 20px; font-size: 1rem;
      font-weight: bold; color: var(--text-main); box-shadow: 0 6px 16px rgba(255, 126, 179, 0.1); cursor: pointer;
      transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .control-btn:active { transform: scale(0.96); background: #fff5f7; }
    
    #bleeding-btn.is-bleeding { background: #ffe3e9; color: var(--danger); border: 2px solid #ffb3c6; }
    .btn-icon { font-size: 1.6rem; }

    #reset-btn { grid-column: span 2; background: linear-gradient(135deg, #ff9a9e, #ff7eb3); color: white; flex-direction: row; justify-content: center; gap: 10px;}
    #reset-btn:active { opacity: 0.8; }
    
    #cancel-btn { grid-column: span 2; background: transparent; color: var(--text-sub); box-shadow: none; padding: 5px; margin-top: -10px; font-size: 0.95rem; text-decoration: underline;}

    #calendar-container {
      width: 100%; max-width: 350px; background: var(--card-bg); border-radius: 24px; padding: 20px;
      box-shadow: 0 8px 24px rgba(255, 126, 179, 0.15); box-sizing: border-box; margin-bottom: 40px;
    }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .calendar-header button { background: #ffe3e9; border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 1.2rem; color: var(--primary); font-weight: bold; }
    #calendar-month { font-size: 1.2rem; font-weight: bold; color: var(--primary); }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .day-name { font-size: 0.8rem; color: var(--text-sub); font-weight: bold; margin-bottom: 8px; text-align: center;}
    .calendar-day {
      aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      border-radius: 50%; font-size: 1rem; position: relative; font-weight: bold;
    }
    .calendar-day.empty { background: transparent; }
    .calendar-day.today { border: 2px dashed var(--primary-light); color: var(--primary); }
    .calendar-day.taken { background: var(--success); color: white; border: none; }
    .calendar-day.bleeding::after { content: '💧'; position: absolute; bottom: -8px; font-size: 0.75rem; }
    
    .legend { display: flex; justify-content: center; gap: 20px; margin-top: 20px; font-size: 0.85rem; color: var(--text-sub); font-weight: bold; }

    #modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(93, 64, 55, 0.4); z-index: 1000; justify-content: center; align-items: center;
    }
    #modal-content {
      background: white; border-radius: 28px; padding: 30px 20px; width: 85%; max-width: 320px;
      text-align: center; box-shadow: 0 15px 35px rgba(255, 126, 179, 0.25);
    }
    #modal-content h3 { margin: 0 0 10px 0; color: var(--primary); font-size: 1.3rem; }
    #modal-content p { font-size: 0.95rem; color: var(--text-main); font-weight: bold; margin-bottom: 20px; line-height: 1.4;}
    #day-input {
      width: 130px; font-size: 1.6rem; padding: 10px; text-align: center; border: 3px solid var(--primary-light);
      border-radius: 16px; margin-bottom: 25px; color: var(--text-main); font-weight: bold; outline: none;
    }
    #day-input:focus { border-color: var(--primary); }
    .modal-btns { display: flex; gap: 10px; justify-content: center; }
    .modal-btn { padding: 14px 20px; border: none; border-radius: 18px; font-weight: bold; font-size: 1rem; cursor: pointer; flex: 1; }
    #modal-cancel { background: var(--bg-color); color: var(--text-sub); }
    #modal-ok { background: linear-gradient(135deg, #ffb3c6, #ff7eb3); color: white; }
  </style>
</head>
<body>

  <div class="header">
    <h1 id="year-display">2026年</h1>
    <div id="date-display">10月27日 (火)</div>
  </div>
  
  <div class="cycle-card">
    <button id="edit-days-btn" title="日数を調整">⚙️</button>
    <div class="cycle-title">現在のサイクル 🎀</div>
    <div class="cycle-days" id="cycle-count">-- <span>日目</span></div>
    
    <div class="progress-container">
      <div class="progress-bar" id="cycle-progress"></div>
    </div>
    <div class="progress-labels">
      <span>1日目</span>
      <span>上限120日</span>
    </div>
  </div>

  <div id="alert-banner"></div>
  
  <div class="main-action-area">
    <button id="action-btn" class="not-taken">飲む</button>
  </div>

  <div class="controls-grid">
    <button id="bleeding-btn" class="control-btn">
      <span class="btn-icon" id="bleeding-icon">🤍</span>
      <span id="bleeding-text">今日の出血</span>
    </button>
    <button id="calendar-jump-btn" class="control-btn" onclick="document.getElementById('calendar-container').scrollIntoView({behavior: 'smooth'})">
      <span class="btn-icon">🌸</span>
      <span>履歴を見る</span>
    </button>
    <button id="cancel-btn" class="control-btn">今日の服用記録を取り消す</button>
    <button id="reset-btn" class="control-btn">
      <span class="btn-icon">✨</span>
      <span>4日間休薬完了 (リセット)</span>
    </button>
  </div>

  <div id="calendar-container">
    <div class="calendar-header">
      <button id="prev-month">&lt;</button>
      <div id="calendar-month"></div>
      <button id="next-month">&gt;</button>
    </div>
    <div class="calendar-grid" id="calendar-grid"></div>
    <div class="legend">
      <span>🟢 服用済</span>
      <span>💧 出血あり</span>
    </div>
  </div>

  <!-- カスタムモーダル -->
  <div id="modal-overlay">
    <div id="modal-content">
      <h3 id="modal-title">日数の調整 🎀</h3>
      <p id="modal-desc">今日は連続服用 何日目ですか？<br><span style="font-size: 0.8rem; color: #bcaaa4;">(数字を入力してください)</span></p>
      <input type="text" id="day-input" inputmode="numeric" />
      <div class="modal-btns">
        <button class="modal-btn" id="modal-cancel">やめる</button>
        <button class="modal-btn" id="modal-ok">決定 ✨</button>
      </div>
    </div>
  </div>

  <script>
    let takenDates = JSON.parse(localStorage.getItem('pillTakenDates')) || [];
    let takenTimes = JSON.parse(localStorage.getItem('pillTakenTimes')) || {};
    let bleedingDates = JSON.parse(localStorage.getItem('bleedingDates')) || [];
    let cycleStartDate = localStorage.getItem('cycleStartDate');
    
    // モーダルの状態管理用
    let currentModalMode = 'days'; // 'days' または 'time'

    function formatDateString(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    const todayObj = new Date();
    const todayStr = formatDateString(todayObj);
    const dayOfWeekStr = ['日', '月', '火', '水', '木', '金', '土'][todayObj.getDay()];
    
    document.getElementById('year-display').innerText = `${todayObj.getFullYear()}年`;
    document.getElementById('date-display').innerText = `${todayObj.getMonth() + 1}月${todayObj.getDate()}日 (${dayOfWeekStr})`;

    function calculateCycleDays() {
      if (!cycleStartDate) {
        cycleStartDate = todayStr;
        localStorage.setItem('cycleStartDate', cycleStartDate);
      }
      const start = new Date(cycleStartDate);
      const current = new Date(todayStr);
      const diffTime = Math.abs(current - start);
      return Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
    }

    function getOffsetDateStr(offsetDays) {
      const d = new Date(todayObj);
      d.setDate(d.getDate() + offsetDays);
      return formatDateString(d);
    }

    let currentDisplayDate = new Date(todayObj.getFullYear(), todayObj.getMonth(), 1);

    const actionBtn = document.getElementById('action-btn');
    const bleedingBtn = document.getElementById('bleeding-btn');
    const bleedingIcon = document.getElementById('bleeding-icon');
    const cancelBtn = document.getElementById('cancel-btn');
    const alertBanner = document.getElementById('alert-banner');
    const progressBar = document.getElementById('cycle-progress');
    const modal = document.getElementById('modal-overlay');
    const dayInput = document.getElementById('day-input');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');

    function updateTopUI() {
      const cycleDays = calculateCycleDays();
      document.getElementById('cycle-count').innerHTML = `${cycleDays} <span>日目</span>`;

      let progressPercent = (cycleDays / 120) * 100;
      if (progressPercent > 100) progressPercent = 100;
      progressBar.style.width = `${progressPercent}%`;
      
      if (cycleDays >= 110) {
        progressBar.style.background = 'var(--danger)';
      } else if (cycleDays >= 90) {
        progressBar.style.background = 'var(--warning)';
      } else {
        progressBar.style.background = 'linear-gradient(90deg, #ffb3c6, #ff7eb3)';
      }

      if (takenDates.includes(todayStr)) {
        const t = takenTimes[todayStr];
        actionBtn.innerHTML = t ? `完了<br><span style="font-size: 1.2rem; font-weight: normal; opacity: 0.9;">🕒 ${t}</span>` : "完了";
        actionBtn.className = "taken";
        actionBtn.disabled = false; // 時間修正のために押せるようにする
        cancelBtn.style.display = "flex";
      } else {
        actionBtn.innerText = "飲む";
        actionBtn.className = "not-taken";
        actionBtn.disabled = false;
        cancelBtn.style.display = "none";
      }

      if (bleedingDates.includes(todayStr)) {
        bleedingBtn.classList.add('is-bleeding');
        bleedingIcon.innerText = "💧";
      } else {
        bleedingBtn.classList.remove('is-bleeding');
        bleedingIcon.innerText = "🤍";
      }

      const yesterdayStr = getOffsetDateStr(-1);
      const twoDaysAgoStr = getOffsetDateStr(-2);
      const has3DaysBleeding = bleedingDates.includes(todayStr) && bleedingDates.includes(yesterdayStr) && bleedingDates.includes(twoDaysAgoStr);

      if (cycleDays >= 120) {
        alertBanner.innerHTML = "⚠️ <strong>連続服用が120日に達しました。</strong><br>明日から4日間は必ず休薬してください。";
        alertBanner.style.display = "block";
      } else if (has3DaysBleeding) {
        alertBanner.innerHTML = "⚠️ <strong>出血が3日連続しました。</strong><br>明日から4日間は休薬してください。";
        alertBanner.style.display = "block";
      } else {
        alertBanner.style.display = "none";
      }
    }

    function renderCalendar() {
      const year = currentDisplayDate.getFullYear();
      const month = currentDisplayDate.getMonth();
      document.getElementById('calendar-month').innerText = `${year}年 ${month + 1}月`;
      
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';
      
      const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
      dayNames.forEach(day => {
        const el = document.createElement('div');
        el.className = 'day-name';
        el.innerText = day;
        grid.appendChild(el);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const el = document.createElement('div');
        el.className = 'calendar-day empty';
        grid.appendChild(el);
      }

      for (let i = 1; i <= daysInMonth; i++) {
        const cell = document.createElement('div');
        cell.className = 'calendar-day';
        cell.innerText = i;
        const cellDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;

        if (cellDateStr === todayStr) cell.classList.add('today');
        if (takenDates.includes(cellDateStr)) cell.classList.add('taken');
        if (bleedingDates.includes(cellDateStr)) cell.classList.add('bleeding');

        grid.appendChild(cell);
      }
    }

    actionBtn.addEventListener('click', () => {
      if (!takenDates.includes(todayStr)) {
        // まだ飲んでいない場合 -> 現在時刻を記録
        const now = new Date();
        const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        takenDates.push(todayStr);
        takenTimes[todayStr] = timeStr;
        localStorage.setItem('pillTakenDates', JSON.stringify(takenDates));
        localStorage.setItem('pillTakenTimes', JSON.stringify(takenTimes));
        updateTopUI();
        renderCalendar();
      } else {
        // すでに飲んでいる場合 -> 時間修正モーダルを表示
        currentModalMode = 'time';
        modalTitle.innerText = "時間の修正 🕒";
        modalDesc.innerHTML = "実際に飲んだ時間を入力してください<br><span style='font-size: 0.8rem; color: #bcaaa4;'>(例: 08:30)</span>";
        dayInput.type = "time";
        dayInput.value = takenTimes[todayStr] || "";
        modal.style.display = 'flex';
      }
    });

    bleedingBtn.addEventListener('click', () => {
      if (bleedingDates.includes(todayStr)) {
        bleedingDates = bleedingDates.filter(d => d !== todayStr);
      } else {
        bleedingDates.push(todayStr);
      }
      localStorage.setItem('bleedingDates', JSON.stringify(bleedingDates));
      updateTopUI();
      renderCalendar();
    });

    cancelBtn.addEventListener('click', () => {
      takenDates = takenDates.filter(date => date !== todayStr);
      delete takenTimes[todayStr];
      localStorage.setItem('pillTakenDates', JSON.stringify(takenDates));
      localStorage.setItem('pillTakenTimes', JSON.stringify(takenTimes));
      updateTopUI();
      renderCalendar();
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      if(confirm(`4日間の休薬が完了しましたか？\n今日から「1日目」として新しいサイクルを開始します。`)) {
        cycleStartDate = todayStr;
        localStorage.setItem('cycleStartDate', cycleStartDate);
        updateTopUI();
      }
    });
    
    // 日数手動調整ボタン
    document.getElementById('edit-days-btn').addEventListener('click', () => {
      currentModalMode = 'days';
      modalTitle.innerText = "日数の調整 🎀";
      modalDesc.innerHTML = "今日は連続服用 何日目ですか？<br><span style='font-size: 0.8rem; color: #bcaaa4;'>(数字を入力してください)</span>";
      dayInput.type = "number";
      dayInput.value = calculateCycleDays();
      modal.style.display = 'flex';
    });
    
    document.getElementById('modal-cancel').addEventListener('click', () => {
      modal.style.display = 'none';
    });

    document.getElementById('modal-ok').addEventListener('click', () => {
      if (currentModalMode === 'days') {
        const targetDay = parseInt(dayInput.value, 10);
        if (targetDay > 0) {
          const start = new Date(todayObj);
          start.setDate(start.getDate() - (targetDay - 1));
          cycleStartDate = formatDateString(start);
          localStorage.setItem('cycleStartDate', cycleStartDate);
          updateTopUI();
        }
      } else if (currentModalMode === 'time') {
        if (dayInput.value.trim() !== "") {
          takenTimes[todayStr] = dayInput.value.trim();
          localStorage.setItem('pillTakenTimes', JSON.stringify(takenTimes));
          updateTopUI();
        }
      }
      modal.style.display = 'none';
    });

    document.getElementById('prev-month').addEventListener('click', () => {
      currentDisplayDate.setMonth(currentDisplayDate.getMonth() - 1);
      renderCalendar();
    });
    document.getElementById('next-month').addEventListener('click', () => {
      currentDisplayDate.setMonth(currentDisplayDate.getMonth() + 1);
      renderCalendar();
    });

    updateTopUI();
    renderCalendar();
  </script>
</body>
</html>
